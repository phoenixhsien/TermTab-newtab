<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="web_title"></title>
    <!-- 字体与图标库 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="visibility: hidden;">
<div class="container">
    <!-- 主终端区域 -->
    <main class="terminal-panel">
        <div class="terminal-header">
            <span class="window-title">user@ubuntu: ~/newtab</span>
            <div class="window-controls">
                <span class="control"></span>
                <span class="control"></span>
                <span class="control"></span>
            </div>
        </div>
        <div id="output" class="terminal-output" tabindex="0">
            <!-- 欢迎信息会由js动态输出 -->
        </div>
        <div class="input-line">
            <span class="prompt">user@ubuntu:~$</span>
            <input type="text" id="cmdInput" class="cmd-input" autofocus spellcheck="false" autocomplete="off" />
        </div>
    </main>

    <!-- 右侧备忘录面板 (Ubuntu风格卡片) -->
    <aside class="memo-panel">
        <div class="panel-header">
            <i class="fas fa-sticky-note"></i>
            <span data-i18n="memo_header"></span>
            <button id="editMemoBtn" class="icon-btn" data-i18n-title="edit_tooltip" title="编辑备忘录 (支持Markdown)">
                <i class="fas fa-pencil-alt"></i>
            </button>
        </div>
        <div id="memoDisplay" class="memo-content markdown-body">
            <!-- 渲染后的备忘录内容 -->
        </div>
        <!-- 隐藏的编辑区 (默认隐藏) -->
        <div id="memoEditor" class="memo-editor" style="display: none;">
        <textarea id="memoTextarea" data-i18n-placeholder="memo_placeholder" placeholder="# 支持 Markdown
- [ ] 待办事项
- [x] 已完成
**粗体**  *斜体*"></textarea>
            <div class="editor-actions">
                <button id="saveMemoBtn" class="ubuntu-btn" data-i18n="save_btn"></button>
                <button id="cancelMemoBtn" class="ubuntu-btn secondary" data-i18n="cancel_btn"></button>
            </div>
        </div>
    </aside>
</div>

<!-- 引入Markdown解析库 -->
<script src="lib/marked.min.js"></script>
<!-- 业务脚本 -->
<script src="js/storage.js"></script>
<script src="js/terminal.js"></script>
<script src="js/lang-manager.js"></script>
<script src="js/main.js"></script>
</body>
</html>
